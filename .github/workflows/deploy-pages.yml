# Builds the static site and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Optional: add a repository secret
# INSTRUCTOR_PASSCODE (Settings → Secrets and variables → Actions);
# without it the default passcode (2468) is used.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/nerve-block-ar-trainer-fs4grs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          VITE_INSTRUCTOR_PASSCODE: ${{ secrets.INSTRUCTOR_PASSCODE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
